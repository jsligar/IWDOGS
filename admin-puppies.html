<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Puppies Management - Mount Olympus Admin</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            background: var(--slate-darkest);
            min-height: 100vh;
            color: var(--wheaten-light);
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--slate-dark);
        }

        .admin-header h1 {
            color: var(--wheaten-light);
            margin: 0;
        }

        .header-actions {
            display: flex;
            gap: 10px;
        }

        .admin-nav {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .admin-nav a {
            padding: 10px 20px;
            background: var(--slate-dark);
            color: var(--wheaten-light);
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .admin-nav a:hover,
        .admin-nav a.active {
            background: var(--wheaten-warm);
            color: var(--slate-darkest);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .btn-sm {
            padding: 8px 16px;
            font-size: 14px;
        }

        .btn-primary {
            background: var(--wheaten-warm);
            color: var(--slate-darkest);
        }

        .btn-secondary {
            background: var(--slate-dark);
            color: var(--wheaten-light);
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .message {
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }

        #loading {
            text-align: center;
            padding: 50px;
            font-size: 18px;
        }

        .empty-state {
            text-align: center;
            padding: 80px 20px;
            display: none;
        }

        .empty-state h2 {
            color: var(--wheaten-warm);
            margin-bottom: 15px;
        }

        .puppies-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(320px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .puppy-card {
            background: var(--slate-dark);
            border-radius: 10px;
            padding: 20px;
            border: 2px solid var(--slate-medium);
        }

        .puppy-card-header {
            margin-bottom: 15px;
            border-bottom: 2px solid var(--slate-medium);
            padding-bottom: 10px;
        }

        .puppy-card h3 {
            color: var(--wheaten-light);
            margin: 0 0 10px 0;
        }

        .puppy-details {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .gender-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
        }

        .gender-badge.male {
            background: #2196f3;
            color: white;
        }

        .gender-badge.female {
            background: #e91e63;
            color: white;
        }

        .status-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-badge.available {
            background: #4caf50;
            color: white;
        }

        .status-badge.reserved {
            background: #ff9800;
            color: white;
        }

        .status-badge.sold {
            background: #9e9e9e;
            color: white;
        }

        .puppy-info {
            color: var(--wheaten-light);
            font-size: 14px;
            line-height: 1.8;
        }

        .puppy-info p {
            margin: 5px 0;
        }

        .puppy-actions {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--slate-medium);
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: var(--slate-dark);
            padding: 30px;
            border-radius: 10px;
            width: 90%;
            max-width: 600px;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-content h2 {
            color: var(--wheaten-light);
            margin-top: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: var(--wheaten-light);
            margin-bottom: 5px;
            font-weight: 600;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 10px;
            border: 1px solid var(--slate-medium);
            border-radius: 5px;
            background: var(--slate-darkest);
            color: var(--wheaten-light);
            font-size: 14px;
        }

        .form-group textarea {
            min-height: 80px;
            resize: vertical;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        @media (max-width: 768px) {
            .form-row {
                grid-template-columns: 1fr;
            }

            .puppies-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>🐶 Puppies Management</h1>
            <div class="header-actions">
                <button onclick="openModal()" class="btn btn-primary">+ Add Puppy</button>
                <a href="dashboard.html" class="btn btn-secondary">Dashboard</a>
                <button id="logout-btn" class="btn btn-secondary">Logout</button>
            </div>
        </div>

        <nav class="admin-nav">
            <a href="admin-dogs.html">Dogs</a>
            <a href="admin-litters.html">Litters</a>
            <a href="admin-puppies.html" class="active">Puppies</a>
            <a href="admin-applications.html">Applications</a>
            <a href="admin-waitlist.html">Waitlist</a>
            <a href="admin-orders.html">Orders</a>
            <a href="admin-testimonials.html">Testimonials</a>
            <a href="admin-faq.html">FAQs</a>
        </nav>

        <div id="message" class="message"></div>

        <div id="loading">Loading puppies...</div>

        <div id="empty-state" class="empty-state">
            <h2>No Puppies Yet</h2>
            <p>Click the "+ Add Puppy" button to add your first puppy</p>
        </div>

        <div id="puppies-container" style="display: none;">
            <div id="puppies-grid" class="puppies-grid"></div>
        </div>
    </div>

    <!-- Add/Edit Puppy Modal -->
    <div id="modal" class="modal">
        <div class="modal-content">
            <h2 id="form-title">Add New Puppy</h2>
            <form id="puppy-form">
                <div class="form-group">
                    <label for="puppy-name">Puppy Name <span style="color: #dc3545;">*</span></label>
                    <input type="text" id="puppy-name" required placeholder="e.g., Athena">
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="puppy-gender">Gender <span style="color: #dc3545;">*</span></label>
                        <select id="puppy-gender" required>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="puppy-dob">Date of Birth <span style="color: #dc3545;">*</span></label>
                        <input type="date" id="puppy-dob" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="puppy-color">Color</label>
                        <input type="text" id="puppy-color" placeholder="e.g., Brindle, Grey">
                    </div>

                    <div class="form-group">
                        <label for="puppy-weight">Weight (lbs)</label>
                        <input type="number" id="puppy-weight" step="0.1" placeholder="e.g., 15.5">
                    </div>
                </div>

                <div class="form-group">
                    <label for="puppy-litter">Litter</label>
                    <select id="puppy-litter">
                        <option value="">Select Litter</option>
                    </select>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="puppy-microchip">Microchip #</label>
                        <input type="text" id="puppy-microchip" placeholder="e.g., 982000123456789">
                    </div>

                    <div class="form-group">
                        <label for="puppy-price">Price ($)</label>
                        <input type="number" id="puppy-price" step="100" placeholder="e.g., 2500">
                    </div>
                </div>

                <div class="form-group">
                    <label for="puppy-status">Status <span style="color: #dc3545;">*</span></label>
                    <select id="puppy-status" required>
                        <option value="available">Available</option>
                        <option value="reserved">Reserved</option>
                        <option value="sold">Sold</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="puppy-notes">Notes</label>
                    <textarea id="puppy-notes" placeholder="Additional notes about this puppy..."></textarea>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 30px;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Save Puppy</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="admin-puppies.js"></script>
</body>
</html>
