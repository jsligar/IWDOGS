<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Litters Management - Mount Olympus Admin</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            background: var(--slate-darkest);
            min-height: 100vh;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--slate-dark);
        }

        .admin-header h1 {
            color: var(--wheaten-light);
            margin: 0;
        }

        .admin-nav {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        .admin-nav a {
            padding: 10px 20px;
            background: var(--slate-dark);
            color: var(--wheaten-light);
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .admin-nav a:hover,
        .admin-nav a.active {
            background: var(--wheaten-warm);
            color: var(--slate-darkest);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: var(--wheaten-warm);
            color: var(--slate-darkest);
        }

        .btn-primary:hover {
            background: var(--wheaten-light);
        }

        .btn-secondary {
            background: var(--slate-dark);
            color: var(--wheaten-light);
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .btn-sm {
            padding: 6px 12px;
            font-size: 14px;
        }

        .litters-list {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .litter-card {
            background: var(--slate-dark);
            border-radius: 10px;
            padding: 25px;
            position: relative;
        }

        .litter-card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 20px;
        }

        .litter-title {
            flex: 1;
        }

        .litter-title h3 {
            color: var(--wheaten-light);
            margin: 0 0 5px 0;
            font-size: 20px;
        }

        .litter-subtitle {
            color: var(--wheaten-warm);
            font-size: 14px;
        }

        .status-badge {
            padding: 6px 16px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .status-badge.planned {
            background: #9e9e9e;
            color: white;
        }

        .status-badge.confirmed {
            background: #2196f3;
            color: white;
        }

        .status-badge.whelped {
            background: #ff9800;
            color: white;
        }

        .status-badge.vet_cleared {
            background: #4caf50;
            color: white;
        }

        .status-badge.ready {
            background: #8bc34a;
            color: white;
        }

        .status-badge.completed {
            background: #607d8b;
            color: white;
        }

        .litter-info {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }

        .info-item {
            color: var(--wheaten-light);
        }

        .info-item label {
            display: block;
            color: var(--wheaten-warm);
            font-size: 12px;
            margin-bottom: 4px;
        }

        .info-item value {
            font-size: 16px;
            font-weight: 500;
        }

        .litter-tasks {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid var(--slate-darkest);
        }

        .litter-tasks h4 {
            color: var(--wheaten-warm);
            margin: 0 0 15px 0;
            font-size: 15px;
        }

        .task-list {
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .task-item {
            background: var(--slate-darkest);
            padding: 12px 15px;
            border-radius: 5px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .task-item.completed {
            opacity: 0.6;
        }

        .task-item.completed .task-title {
            text-decoration: line-through;
        }

        .task-info {
            flex: 1;
        }

        .task-title {
            color: var(--wheaten-light);
            font-weight: 500;
            margin-bottom: 4px;
        }

        .task-date {
            color: var(--wheaten-warm);
            font-size: 12px;
        }

        .task-date.overdue {
            color: #ff5252;
            font-weight: bold;
        }

        .task-check {
            width: 24px;
            height: 24px;
            cursor: pointer;
        }

        .litter-actions {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--slate-dark);
            border-radius: 10px;
            padding: 30px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: var(--wheaten-light);
            margin: 0;
        }

        .close-modal {
            background: none;
            border: none;
            color: var(--wheaten-light);
            font-size: 30px;
            cursor: pointer;
            padding: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: var(--wheaten-warm);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--slate-darkest);
            background: var(--slate-darkest);
            color: var(--wheaten-light);
            border-radius: 5px;
            font-size: 14px;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--wheaten-warm);
        }

        .empty-state h2 {
            color: var(--wheaten-light);
            margin-bottom: 10px;
        }

        .error-message {
            background: #dc3545;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .success-message {
            background: #4caf50;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--wheaten-warm);
            font-size: 18px;
        }

        .pricing-section {
            background: var(--slate-darkest);
            padding: 20px;
            border-radius: 5px;
            margin-top: 20px;
        }

        .pricing-section h3 {
            color: var(--wheaten-warm);
            margin: 0 0 15px 0;
            font-size: 16px;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>🐾 Litters Management</h1>
            <button class="btn btn-primary" onclick="showAddLitterModal()">+ Add Litter</button>
        </div>

        <nav class="admin-nav">
            <a href="dashboard.html">Dashboard</a>
            <a href="admin-dogs.html">Dogs</a>
            <a href="admin-litters.html" class="active">Litters</a>
            <a href="admin-puppies.html">Puppies</a>
            <a href="admin-applications.html">Applications</a>
            <a href="admin-waitlist.html">Waitlist</a>
            <a href="admin-orders.html">Orders</a>
        </nav>

        <div id="message-container"></div>

        <div id="loading" class="loading">Loading litters...</div>

        <div id="litters-container" style="display: none;">
            <div class="litters-list" id="litters-list"></div>
        </div>

        <div id="empty-state" class="empty-state" style="display: none;">
            <h2>No Litters Yet</h2>
            <p>Add your first litter to start tracking breeding and puppies</p>
            <button class="btn btn-primary" onclick="showAddLitterModal()">+ Add Litter</button>
        </div>
    </div>

    <!-- Add/Edit Litter Modal -->
    <div id="litter-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Add Litter</h2>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>

            <form id="litter-form">
                <input type="hidden" id="litter-id">

                <div class="form-row">
                    <div class="form-group">
                        <label for="litter-dam">Dam (Mother) *</label>
                        <select id="litter-dam" required>
                            <option value="">Select Dam...</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="litter-sire">Sire (Father) *</label>
                        <select id="litter-sire" required>
                            <option value="">Select Sire...</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="litter-theme">Litter Theme</label>
                        <input type="text" id="litter-theme" placeholder="e.g., Greek Gods, Mythology">
                    </div>
                    <div class="form-group">
                        <label for="litter-series">Name Series</label>
                        <input type="text" id="litter-series" placeholder="e.g., G Litter">
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="litter-breed-date">Breed Date</label>
                        <input type="date" id="litter-breed-date">
                    </div>
                    <div class="form-group">
                        <label for="litter-due-date">Due Date</label>
                        <input type="date" id="litter-due-date" readonly>
                        <small style="color: var(--wheaten-warm); font-size: 12px;">Auto-calculated (63 days from breed date)</small>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="litter-whelp-date">Actual Whelp Date</label>
                        <input type="date" id="litter-whelp-date">
                    </div>
                    <div class="form-group">
                        <label for="litter-status">Status *</label>
                        <select id="litter-status" required>
                            <option value="planned">Planned</option>
                            <option value="confirmed">Confirmed (Pregnant)</option>
                            <option value="whelped">Whelped</option>
                            <option value="vet_cleared">Vet Cleared</option>
                            <option value="ready">Ready for Go-Home</option>
                            <option value="completed">Completed</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="litter-size">Litter Size (Total Puppies)</label>
                        <input type="number" id="litter-size" min="1" max="20">
                    </div>
                    <div class="form-group">
                        <label for="litter-males">Number of Males</label>
                        <input type="number" id="litter-males" min="0">
                    </div>
                </div>

                <h3 style="color: var(--wheaten-light); margin: 30px 0 15px;">Registry Information</h3>

                <div class="form-row">
                    <div class="form-group">
                        <label for="litter-akc">AKC Litter ID</label>
                        <input type="text" id="litter-akc" placeholder="AKC litter registration">
                    </div>
                    <div class="form-group">
                        <label for="litter-ukc">UKC Litter ID</label>
                        <input type="text" id="litter-ukc" placeholder="UKC litter registration">
                    </div>
                </div>

                <h3 style="color: var(--wheaten-light); margin: 30px 0 15px;">Pricing</h3>

                <div class="pricing-section">
                    <div class="form-row">
                        <div class="form-group">
                            <label for="price-pet">Pet Price ($)</label>
                            <input type="number" id="price-pet" min="0" step="100" placeholder="2500">
                        </div>
                        <div class="form-group">
                            <label for="price-show">Show Price ($)</label>
                            <input type="number" id="price-show" min="0" step="100" placeholder="3500">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="price-breeding">Breeding Price ($)</label>
                            <input type="number" id="price-breeding" min="0" step="100" placeholder="4000">
                        </div>
                        <div class="form-group">
                            <label for="price-coown">Co-Own Price ($)</label>
                            <input type="number" id="price-coown" min="0" step="100" placeholder="2000">
                        </div>
                    </div>
                </div>

                <div class="form-group" style="margin-top: 20px;">
                    <label>
                        <input type="checkbox" id="litter-is-public">
                        Show on public website
                    </label>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 30px;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Save Litter</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="admin-litters.js"></script>
</body>
</html>
