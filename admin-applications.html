<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Applications - Mount Olympus Admin</title><link rel="stylesheet" href="styles.css">
<style>.admin-container{max-width:1400px;margin:0 auto;padding:20px;background:var(--slate-darkest);min-height:100vh;color:var(--wheaten-light)}.admin-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:30px;padding-bottom:20px;border-bottom:2px solid var(--slate-dark)}.admin-header h1{color:var(--wheaten-light);margin:0}.header-actions{display:flex;gap:10px}.admin-nav{display:flex;gap:15px;margin-bottom:30px;flex-wrap:wrap}.admin-nav a{padding:10px 20px;background:var(--slate-dark);color:var(--wheaten-light);text-decoration:none;border-radius:5px;transition:background .3s}.admin-nav a:hover,.admin-nav a.active{background:var(--wheaten-warm);color:var(--slate-darkest)}.btn{padding:12px 24px;border:none;border-radius:5px;cursor:pointer;font-size:16px;transition:all .3s}.btn-sm{padding:8px 16px;font-size:14px}.btn-primary{background:var(--wheaten-warm);color:var(--slate-darkest)}.btn-secondary{background:var(--slate-dark);color:var(--wheaten-light)}.btn-danger{background:#dc3545;color:white}.message{padding:15px;border-radius:5px;margin-bottom:20px;display:none}.message.success{background:#d4edda;color:#155724;border:1px solid #c3e6cb}.message.error{background:#f8d7da;color:#721c24;border:1px solid #f5c6cb}#loading{text-align:center;padding:50px;font-size:18px}.empty-state{text-align:center;padding:80px 20px;display:none}.empty-state h2{color:var(--wheaten-warm)}.applications-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(350px,1fr));gap:20px}.application-card{background:var(--slate-dark);border-radius:10px;padding:20px;border:2px solid var(--slate-medium)}.application-header{display:flex;justify-content:space-between;align-items:start;margin-bottom:15px;padding-bottom:10px;border-bottom:1px solid var(--slate-medium)}.application-header h3{color:var(--wheaten-light);margin:0}.status-badge{display:inline-block;padding:4px 12px;border-radius:15px;font-size:12px;font-weight:bold;text-transform:uppercase}.status-badge.pending{background:#ff9800;color:white}.status-badge.approved{background:#4caf50;color:white}.status-badge.rejected{background:#f44336;color:white}.application-info{color:var(--wheaten-light);font-size:14px;line-height:1.8}.application-info p{margin:5px 0}.application-actions{display:flex;gap:10px;margin-top:15px;padding-top:15px;border-top:1px solid var(--slate-medium)}.modal{display:none;position:fixed;z-index:1000;left:0;top:0;width:100%;height:100%;background:rgba(0,0,0,.7);align-items:center;justify-content:center}.modal-content{background:var(--slate-dark);padding:30px;border-radius:10px;width:90%;max-width:700px;max-height:90vh;overflow-y:auto;color:var(--wheaten-light)}.modal-content h2{color:var(--wheaten-light);margin-top:0}.modal-content p{line-height:1.8;margin:10px 0}@media(max-width:768px){.applications-grid{grid-template-columns:1fr}}</style></head>
<body><div class="admin-container">
<div class="admin-header"><h1>Applications Management</h1>
<div class="header-actions"><a href="dashboard.html" class="btn btn-secondary">Dashboard</a>
<button id="logout-btn" class="btn btn-secondary">Logout</button></div></div>
<nav class="admin-nav"><a href="admin-dogs.html">Dogs</a><a href="admin-litters.html">Litters</a>
<a href="admin-puppies.html">Puppies</a><a href="admin-applications.html" class="active">Applications</a>
<a href="admin-waitlist.html">Waitlist</a><a href="admin-orders.html">Orders</a>
<a href="admin-testimonials.html">Testimonials</a><a href="admin-faq.html">FAQs</a></nav>
<div id="message" class="message"></div><div id="loading">Loading applications...</div>
<div id="empty-state" class="empty-state"><h2>No Applications Yet</h2>
<p>Applications will appear here when submitted</p></div>
<div id="applications-container" style="display:none">
<div id="applications-grid" class="applications-grid"></div></div></div>
<div id="view-modal" class="modal"><div class="modal-content"><h2>Application Details</h2>
<div id="modal-body"></div><button onclick="closeViewModal()" class="btn btn-primary" style="margin-top:20px">Close</button>
</div></div><script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script><script src="admin-applications.js"></script></body></html>
