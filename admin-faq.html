<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Manage FAQs - Admin Portal</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .admin-container {
            max-width: 1200px;
            margin: 0 auto;
            padding: var(--spacing-md);
        }

        .admin-header {
            background: linear-gradient(135deg, var(--slate-dark) 0%, var(--slate-medium) 100%);
            color: var(--text-white);
            padding: var(--spacing-lg);
            border-radius: 8px;
            margin-bottom: var(--spacing-lg);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .admin-header h1 {
            color: var(--wheaten-light);
            margin: 0;
        }

        .faq-form {
            background: var(--bg-white);
            padding: var(--spacing-lg);
            border-radius: 8px;
            box-shadow: 0 2px 8px var(--shadow);
            margin-bottom: var(--spacing-lg);
        }

        .form-group {
            margin-bottom: var(--spacing-md);
        }

        .form-group label {
            display: block;
            font-weight: 600;
            margin-bottom: var(--spacing-xs);
            color: var(--text-dark);
        }

        .form-group input,
        .form-group textarea {
            width: 100%;
            padding: 0.75rem;
            border: 2px solid var(--slate-lighter);
            border-radius: 4px;
            font-family: var(--font-primary);
            font-size: 1rem;
        }

        .form-group textarea {
            min-height: 120px;
            resize: vertical;
        }

        .faq-list {
            display: grid;
            gap: var(--spacing-md);
        }

        .faq-item {
            background: var(--bg-white);
            padding: var(--spacing-md);
            border-radius: 8px;
            box-shadow: 0 2px 4px var(--shadow);
            border-left: 4px solid var(--wheaten-warm);
        }

        .faq-item-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: var(--spacing-sm);
        }

        .faq-question {
            font-weight: 600;
            color: var(--slate-darkest);
            font-size: 1.1rem;
        }

        .faq-answer {
            color: var(--slate-dark);
            margin: var(--spacing-sm) 0;
            line-height: 1.6;
        }

        .faq-actions {
            display: flex;
            gap: var(--spacing-xs);
            margin-top: var(--spacing-sm);
        }

        .btn-edit {
            background: var(--slate-medium);
            color: white;
        }

        .btn-delete {
            background: #dc3545;
            color: white;
        }

        .btn-cancel {
            background: var(--slate-light);
            color: white;
        }

        .empty-state {
            text-align: center;
            padding: var(--spacing-xl);
            color: var(--text-light);
        }

        .message {
            padding: var(--spacing-sm);
            border-radius: 4px;
            margin-bottom: var(--spacing-md);
            display: none;
        }

        .message.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .message.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <div>
                <h1>Manage FAQs</h1>
                <p style="margin: 0; opacity: 0.9;">Frequently Asked Questions</p>
            </div>
            <div style="display: flex; gap: 10px;">
                <a href="dashboard.html" class="btn btn-secondary">Back to Dashboard</a>
                <button id="logout-btn" class="btn btn-secondary">Logout</button>
            </div>
        </div>

        <div id="message" class="message"></div>

        <div class="faq-form">
            <h2 id="form-title">Add New FAQ</h2>
            <form id="faq-form">
                <input type="hidden" id="faq-id">

                <div class="form-group">
                    <label for="question">Question <span style="color: red;">*</span></label>
                    <input type="text" id="question" required placeholder="e.g., How much does an Irish Wolfhound puppy cost?">
                </div>

                <div class="form-group">
                    <label for="answer">Answer <span style="color: red;">*</span></label>
                    <textarea id="answer" required placeholder="Enter the answer..."></textarea>
                </div>

                <div class="form-group">
                    <label for="display-order">Display Order</label>
                    <input type="number" id="display-order" min="0" value="0" placeholder="0 = first, 1 = second, etc.">
                </div>

                <div style="display: flex; gap: 10px;">
                    <button type="submit" class="btn btn-primary">Save FAQ</button>
                    <button type="button" id="cancel-edit" class="btn btn-cancel" style="display: none;">Cancel Edit</button>
                </div>
            </form>
        </div>

        <div class="faq-form">
            <h2>Current FAQs</h2>
            <div id="faq-list" class="faq-list">
                <div class="empty-state">Loading FAQs...</div>
            </div>
        </div>
    </div>

    <!-- Firebase SDKs -->
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="admin-faq.js"></script>
</body>
</html>
