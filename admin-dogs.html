<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dogs Management - Mount Olympus Admin</title>
    <link rel="stylesheet" href="styles.css">
    <style>
        .admin-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px;
            background: var(--slate-darkest);
            min-height: 100vh;
        }

        .admin-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--slate-dark);
        }

        .admin-header h1 {
            color: var(--wheaten-light);
            margin: 0;
        }

        .admin-nav {
            display: flex;
            gap: 15px;
            margin-bottom: 30px;
        }

        .admin-nav a {
            padding: 10px 20px;
            background: var(--slate-dark);
            color: var(--wheaten-light);
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .admin-nav a:hover,
        .admin-nav a.active {
            background: var(--wheaten-warm);
            color: var(--slate-darkest);
        }

        .btn {
            padding: 12px 24px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            transition: all 0.3s;
        }

        .btn-primary {
            background: var(--wheaten-warm);
            color: var(--slate-darkest);
        }

        .btn-primary:hover {
            background: var(--wheaten-light);
        }

        .btn-secondary {
            background: var(--slate-dark);
            color: var(--wheaten-light);
        }

        .btn-danger {
            background: #dc3545;
            color: white;
        }

        .dogs-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(350px, 1fr));
            gap: 20px;
            margin-top: 20px;
        }

        .dog-card {
            background: var(--slate-dark);
            border-radius: 10px;
            padding: 20px;
            position: relative;
        }

        .dog-card-header {
            display: flex;
            justify-content: space-between;
            align-items: start;
            margin-bottom: 15px;
        }

        .dog-role-badge {
            display: inline-block;
            padding: 4px 12px;
            border-radius: 15px;
            font-size: 12px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .dog-role-badge.dam {
            background: #e91e63;
            color: white;
        }

        .dog-role-badge.sire {
            background: #2196f3;
            color: white;
        }

        .dog-role-badge.both {
            background: #9c27b0;
            color: white;
        }

        .dog-card h3 {
            color: var(--wheaten-light);
            margin: 0 0 5px 0;
        }

        .dog-card .call-name {
            color: var(--wheaten-warm);
            font-size: 14px;
            margin-bottom: 10px;
        }

        .dog-info {
            color: var(--wheaten-light);
            font-size: 14px;
            line-height: 1.8;
        }

        .dog-info p {
            margin: 5px 0;
        }

        .health-tests {
            margin-top: 15px;
            padding-top: 15px;
            border-top: 1px solid var(--slate-darkest);
        }

        .health-tests h4 {
            color: var(--wheaten-warm);
            font-size: 13px;
            margin: 0 0 10px 0;
        }

        .health-badge {
            display: inline-block;
            padding: 3px 8px;
            margin: 2px;
            border-radius: 3px;
            font-size: 11px;
            background: #4caf50;
            color: white;
        }

        .dog-actions {
            margin-top: 15px;
            display: flex;
            gap: 10px;
        }

        .dog-actions button {
            flex: 1;
            padding: 8px;
            font-size: 14px;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 1000;
            overflow-y: auto;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .modal-content {
            background: var(--slate-dark);
            border-radius: 10px;
            padding: 30px;
            max-width: 800px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            position: relative;
        }

        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .modal-header h2 {
            color: var(--wheaten-light);
            margin: 0;
        }

        .close-modal {
            background: none;
            border: none;
            color: var(--wheaten-light);
            font-size: 30px;
            cursor: pointer;
            line-height: 1;
            padding: 0;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            color: var(--wheaten-warm);
            margin-bottom: 8px;
            font-weight: 500;
        }

        .form-group input,
        .form-group select,
        .form-group textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid var(--slate-darkest);
            background: var(--slate-darkest);
            color: var(--wheaten-light);
            border-radius: 5px;
            font-size: 14px;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .health-tests-form {
            background: var(--slate-darkest);
            padding: 15px;
            border-radius: 5px;
            margin-top: 10px;
        }

        .health-tests-form h3 {
            color: var(--wheaten-warm);
            font-size: 16px;
            margin: 0 0 15px 0;
        }

        .health-test-section {
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--slate-dark);
        }

        .health-test-section:last-child {
            border-bottom: none;
        }

        .health-test-section h4 {
            color: var(--wheaten-light);
            font-size: 14px;
            margin: 0 0 10px 0;
        }

        .empty-state {
            text-align: center;
            padding: 60px 20px;
            color: var(--wheaten-warm);
        }

        .empty-state h2 {
            color: var(--wheaten-light);
            margin-bottom: 10px;
        }

        .error-message {
            background: #dc3545;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .success-message {
            background: #4caf50;
            color: white;
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 20px;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--wheaten-warm);
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="admin-header">
            <h1>Dogs Management</h1>
            <button class="btn btn-primary" onclick="showAddDogModal()">+ Add Dog</button>
        </div>

        <nav class="admin-nav">
            <a href="dashboard.html">Dashboard</a>
            <a href="admin-dogs.html" class="active">Dogs</a>
            <a href="admin-litters.html">Litters</a>
            <a href="admin-puppies.html">Puppies</a>
            <a href="admin-applications.html">Applications</a>
            <a href="admin-waitlist.html">Waitlist</a>
            <a href="admin-orders.html">Orders</a>
        </nav>

        <div id="message-container"></div>

        <div id="loading" class="loading">Loading dogs...</div>

        <div id="dogs-container" style="display: none;">
            <div class="dogs-grid" id="dogs-grid"></div>
        </div>

        <div id="empty-state" class="empty-state" style="display: none;">
            <h2>No Dogs Yet</h2>
            <p>Add your first dam or sire to get started</p>
            <button class="btn btn-primary" onclick="showAddDogModal()">+ Add Dog</button>
        </div>
    </div>

    <!-- Add/Edit Dog Modal -->
    <div id="dog-modal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2 id="modal-title">Add Dog</h2>
                <button class="close-modal" onclick="closeModal()">&times;</button>
            </div>

            <form id="dog-form">
                <input type="hidden" id="dog-id">

                <div class="form-row">
                    <div class="form-group">
                        <label for="dog-name">Registered Name *</label>
                        <input type="text" id="dog-name" required>
                    </div>
                    <div class="form-group">
                        <label for="dog-call-name">Call Name *</label>
                        <input type="text" id="dog-call-name" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="dog-role">Role *</label>
                        <select id="dog-role" required>
                            <option value="">Select...</option>
                            <option value="dam">Dam (Female)</option>
                            <option value="sire">Sire (Male)</option>
                            <option value="both">Both</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label for="dog-sex">Sex *</label>
                        <select id="dog-sex" required>
                            <option value="">Select...</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="dog-dob">Date of Birth</label>
                        <input type="date" id="dog-dob">
                    </div>
                    <div class="form-group">
                        <label for="dog-color">Color</label>
                        <input type="text" id="dog-color" placeholder="e.g., Wheaten, Brindle">
                    </div>
                </div>

                <h3 style="color: var(--wheaten-light); margin: 30px 0 15px;">Registry Information</h3>

                <div class="form-row">
                    <div class="form-group">
                        <label for="dog-akc">AKC Number</label>
                        <input type="text" id="dog-akc" placeholder="PR12345678">
                    </div>
                    <div class="form-group">
                        <label for="dog-ukc">UKC Number</label>
                        <input type="text" id="dog-ukc" placeholder="UC123456">
                    </div>
                </div>

                <div class="form-group">
                    <label for="dog-iwca">IWCA Number</label>
                    <input type="text" id="dog-iwca" placeholder="IWCA1234">
                </div>

                <h3 style="color: var(--wheaten-light); margin: 30px 0 15px;">Health Tests (OFA)</h3>

                <div class="health-tests-form">
                    <div class="health-test-section">
                        <h4>Hips</h4>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="ofa-hips-result">Result</label>
                                <select id="ofa-hips-result">
                                    <option value="">Not tested</option>
                                    <option value="Excellent">Excellent</option>
                                    <option value="Good">Good</option>
                                    <option value="Fair">Fair</option>
                                    <option value="Borderline">Borderline</option>
                                    <option value="Mild">Mild</option>
                                    <option value="Moderate">Moderate</option>
                                    <option value="Severe">Severe</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="ofa-hips-cert">Certificate #</label>
                                <input type="text" id="ofa-hips-cert" placeholder="IW-1234E24M-VPI">
                            </div>
                        </div>
                    </div>

                    <div class="health-test-section">
                        <h4>Elbows</h4>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="ofa-elbows-result">Result</label>
                                <select id="ofa-elbows-result">
                                    <option value="">Not tested</option>
                                    <option value="Normal">Normal</option>
                                    <option value="Grade I">Grade I</option>
                                    <option value="Grade II">Grade II</option>
                                    <option value="Grade III">Grade III</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="ofa-elbows-cert">Certificate #</label>
                                <input type="text" id="ofa-elbows-cert" placeholder="IW-1234E24-VPI">
                            </div>
                        </div>
                    </div>

                    <div class="health-test-section">
                        <h4>Heart (Cardiac)</h4>
                        <div class="form-row">
                            <div class="form-group">
                                <label for="ofa-heart-result">Result</label>
                                <select id="ofa-heart-result">
                                    <option value="">Not tested</option>
                                    <option value="Normal">Normal</option>
                                    <option value="Equivocal">Equivocal</option>
                                    <option value="Abnormal">Abnormal</option>
                                </select>
                            </div>
                            <div class="form-group">
                                <label for="ofa-heart-cert">Certificate #</label>
                                <input type="text" id="ofa-heart-cert" placeholder="IW-CA1234/24M/C-VPI">
                            </div>
                        </div>
                    </div>
                </div>

                <div class="form-group" style="margin-top: 20px;">
                    <label for="dog-titles">Titles (comma separated)</label>
                    <input type="text" id="dog-titles" placeholder="e.g., CH, GCH, CGC">
                </div>

                <div class="form-group">
                    <label for="dog-status">Status</label>
                    <select id="dog-status">
                        <option value="active">Active</option>
                        <option value="retired">Retired</option>
                        <option value="deceased">Deceased</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>
                        <input type="checkbox" id="dog-is-public">
                        Show on public website
                    </label>
                </div>

                <div style="display: flex; gap: 10px; margin-top: 30px;">
                    <button type="submit" class="btn btn-primary" style="flex: 1;">Save Dog</button>
                    <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <script src="firebase-config.js"></script>
    <script src="admin-dogs.js"></script>
</body>
</html>
